name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10 can fail with an "edgesOut" error on this lockfile (see render.yaml); npm 11 installs it.
      - run: npm ci || npx -y npm@11.6.2 ci
      - run: npm run check
      - run: npm run build
