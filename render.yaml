# Render Blueprint: one passcode-protected web service that builds and serves the app.
# See "Hosting on Render" in README.md. Never put the passcode in this file.
services:
  - type: web
    name: house-modeler
    runtime: node
    # A persistent disk needs a paid instance type (the free plan has no disks).
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    # npm 10 can fail `npm ci` with an "edgesOut" error, so fall back to npm 11.
    # --include=dev keeps TypeScript and Vite installed even if NODE_ENV is production.
    buildCommand: (npm ci --include=dev || npx -y npm@11.6.2 ci --include=dev) && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    # Keeps the shared project (Settings -> Project sync) across deploys and restarts.
    disk:
      name: house-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PASSCODE
        sync: false # you type this in the Render dashboard when creating the Blueprint
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data # must be the disk's mountPath above
